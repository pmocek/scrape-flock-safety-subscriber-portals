name: Health check

on:
  schedule:
    # Every hour at :53 — offset from scraper's :23 to avoid overlap
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv and create venv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv --python ${{ env.PYTHON_VERSION }}
        uv pip install -r requirements.txt
        echo "playwright-version=$(uv pip show playwright 2>/dev/null | grep '^Version:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      id: uv-setup

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-playwright-${{ steps.uv-setup.outputs.playwright-version }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        .venv/bin/python3 -m playwright install chromium

    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update -qq
        .venv/bin/python3 -m playwright install-deps chromium

    - name: Run health check
      id: check
      continue-on-error: true
      run: |
        # Use the uv venv explicitly. `uv venv` creates .venv/ but does not put it
        # on PATH, and uv pip install targets .venv/ -- so bare `python3` resolves
        # to the system interpreter, which lacks playwright. This mirrors the
        # .venv detection in scrape.sh.
        if [ -d ".venv" ]; then
          PYTHON=".venv/bin/python3"
        else
          PYTHON="python3"
        fi
        OUTPUT=$(xvfb-run -a "$PYTHON" scripts/health-check.py 2>&1) || true
        echo "$OUTPUT"
        COMMIT_MSG=$(echo "$OUTPUT" | grep "^COMMIT_MSG:" | sed 's/^COMMIT_MSG: //')
        echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
        COMMIT_BODY=$(echo "$OUTPUT" | grep "^COMMIT_BODY:" | sed 's/^COMMIT_BODY: //')
        echo "commit_body<<EOF" >> "$GITHUB_OUTPUT"
        echo "$COMMIT_BODY" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Verify health check produced a commit message
      run: |
        if [ -z "${{ steps.check.outputs.commit_msg }}" ]; then
          echo "::error::health-check.py produced no COMMIT_MSG — check the log above for an import or startup failure."
          exit 1
        fi
        echo "health check OK: ${{ steps.check.outputs.commit_msg }}"

    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Nothing changed — no commit"
          exit 0
        fi
        if [ -n "${{ steps.check.outputs.commit_body }}" ]; then
          git commit -m "${{ steps.check.outputs.commit_msg }}" -m "${{ steps.check.outputs.commit_body }}"
        else
          git commit -m "${{ steps.check.outputs.commit_msg }}"
        fi
        git pull --rebase
        git push
