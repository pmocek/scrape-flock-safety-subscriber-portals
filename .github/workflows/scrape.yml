name: Flock Safety scraper

on:
  push:
  workflow_dispatch:
  schedule:
    # Staggered across the day — each run scrapes a batch
    - cron: '23 2 * * *'   # 2:23 UTC → batch 1
    - cron: '23 6 * * *'   # 6:23 UTC → batch 2
    - cron: '23 10 * * *'  # 10:23 UTC → batch 3
    - cron: '23 14 * * *'  # 14:23 UTC → batch 4
    - cron: '23 18 * * *'  # 18:23 UTC → batch 5
    - cron: '23 22 * * *'  # 22:23 UTC → batch 6

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-playwright-chromium-${{ env.PYTHON_VERSION }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        python3 -m playwright install chromium

    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update -qq
        python3 -m playwright install-deps chromium

    - name: Determine batch
      id: batch
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          HOUR=$(date -u +%H)
          BATCH=$(( (HOUR / 4) + 1 ))
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "Scheduled run — batch $BATCH of 6"
        else
          echo "batch=0" >> "$GITHUB_OUTPUT"
          echo "Push/dispatch — full scrape"
        fi

    - name: Run the scraper
      run: |
        ./scrape.sh --batch ${{ steps.batch.outputs.batch }} --total-batches 6

    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u -Iseconds)
        if git diff --cached --quiet; then
          echo "Nothing changed — no commit"
          exit 0
        fi
        git commit -m "${timestamp} UTC"
        git pull --rebase
        git push
