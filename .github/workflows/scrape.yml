name: Flock Safety scraper

on:
  push:
    paths-ignore:
      - 'data/**'
      - '**.md'
      - '.beads/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      full_scrape:
        description: 'Run full scrape of all agencies (batch 0)'
        type: boolean
        default: false
  schedule:
    # Hourly — 24 batches per day for faster catch-up
    - cron: '23 0 * * *'   # batch 1
    - cron: '23 1 * * *'   # batch 2
    - cron: '23 2 * * *'   # batch 3
    - cron: '23 3 * * *'   # batch 4
    - cron: '23 4 * * *'   # batch 5
    - cron: '23 5 * * *'   # batch 6
    - cron: '23 6 * * *'   # batch 7
    - cron: '23 7 * * *'   # batch 8
    - cron: '23 8 * * *'   # batch 9
    - cron: '23 9 * * *'   # batch 10
    - cron: '23 10 * * *'  # batch 11
    - cron: '23 11 * * *'  # batch 12
    - cron: '23 12 * * *'  # batch 13
    - cron: '23 13 * * *'  # batch 14
    - cron: '23 14 * * *'  # batch 15
    - cron: '23 15 * * *'  # batch 16
    - cron: '23 16 * * *'  # batch 17
    - cron: '23 17 * * *'  # batch 18
    - cron: '23 18 * * *'  # batch 19
    - cron: '23 19 * * *'  # batch 20
    - cron: '23 20 * * *'  # batch 21
    - cron: '23 21 * * *'  # batch 22
    - cron: '23 22 * * *'  # batch 23
    - cron: '23 23 * * *'  # batch 24

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv and create venv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv --python ${{ env.PYTHON_VERSION }}
        uv pip install -r requirements.txt
        echo "playwright-version=$(uv pip show playwright 2>/dev/null | grep '^Version:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      id: uv-setup

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-playwright-${{ steps.uv-setup.outputs.playwright-version }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        .venv/bin/python3 -m playwright install chromium

    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update -qq
        .venv/bin/python3 -m playwright install-deps chromium

    - name: Determine batch
      id: batch
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_scrape }}" = "true" ]; then
          echo "batch=0" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch — full scrape requested"
        else
          HOUR=$(date -u +%H)
          BATCH=$(( 10#$HOUR + 1 ))
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "${{ github.event_name }} run — batch $BATCH of 24"
        fi

    - name: Run the scraper
      run: |
        ./scrape.sh --batch ${{ steps.batch.outputs.batch }} --total-batches 24

    - name: Analyze audit CSVs
      id: audit
      continue-on-error: true
      run: |
        OUTPUT=$(python3 scripts/analyze-audit.py --commit-body 2>&1)
        echo "$OUTPUT"
        COMMIT_BODY=$(echo "$OUTPUT" | grep "^COMMIT_BODY:" || true)
        if [ -n "$COMMIT_BODY" ]; then
          echo "commit_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect NCIC contradictions
      id: ncic
      continue-on-error: true
      run: |
        OUTPUT=$(python3 scripts/ncic-contradiction.py --commit-body 2>&1)
        echo "$OUTPUT"
        COMMIT_BODY=$(echo "$OUTPUT" | grep "^COMMIT_BODY:" || true)
        if [ -n "$COMMIT_BODY" ]; then
          echo "commit_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Nothing changed — no commit"
          exit 0
        fi
        MSG=$(python3 scripts/describe-diff.py)
        if [ -z "$MSG" ]; then
          echo "Nothing meaningful changed — skipping commit"
          exit 0
        fi
        AUDIT_BODY="${{ steps.audit.outputs.commit_body }}"
        NCIC_BODY="${{ steps.ncic.outputs.commit_body }}"
        echo "Commit message:"
        echo "$MSG"
        BODY=""
        if [ -n "$AUDIT_BODY" ]; then
          echo "Audit findings:"
          echo "$AUDIT_BODY"
          BODY="$BODY"$'\n'"Audit findings:"$'\n'"$AUDIT_BODY"
        fi
        if [ -n "$NCIC_BODY" ]; then
          echo "NCIC findings:"
          echo "$NCIC_BODY"
          BODY="$BODY"$'\n'"NCIC findings:"$'\n'"$NCIC_BODY"
        fi
        if [ -n "$BODY" ]; then
          printf '%s\n' "$MSG" "$BODY" | git commit -F -
        else
          git commit -m "$MSG"
        fi
        git pull --rebase
        git push
