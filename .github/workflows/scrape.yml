name: Scrape Flock Safety Portals

on:
  push:
  workflow_dispatch:
  schedule:
    # Daily at 6:00 AM UTC
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Install Playwright browsers and system deps
      run: |
        python3 -m playwright install chromium
        python3 -m playwright install-deps chromium

    - name: Install xvfb (virtual display for Playwright)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Run curl-based scraper (haveibeenflocked.com)
      run: |
        ./scrape.sh

    - name: Refresh WA agency list from haveibeenflocked.com
      run: |
        python3 scrape-flock.py --refresh-agencies

    - name: Run Playwright scraper (all WA agencies via Xvfb)
      run: |
        xvfb-run -a python3 scrape-flock.py

    - name: Commit and push changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git diff --cached --quiet || git commit -m "${timestamp}"
        git pull --rebase
        git push