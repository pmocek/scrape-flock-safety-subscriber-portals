name: Deploy GitHub Pages companion site

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/aggregate-stats.py'
      - 'scripts/export-*'
      - 'scripts/generate-agency-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Flock Safety scraper"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate site data from latest scrape
        run: |
          python3 scripts/aggregate-stats.py
          python3 scripts/export-time-series.py
          python3 scripts/export-ncic-data.py
          python3 scripts/export-audit-data.py
          node scripts/export-network-data.js
          python3 scripts/generate-agency-pages.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true

      - name: Build Hugo static site
        run: |
          cd website
          hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
